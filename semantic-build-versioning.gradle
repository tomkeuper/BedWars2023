startingVersion = '1.0.0'

preRelease {
    startingVersion = 'BETA.1'
    pattern = /BETA/
    bump = {
        "BETA.${((it - ~/^BETA\./) as int) + 1}"
    }
}

autobump {
    // Match explicit tags like [major]/[minor]/[patch] in a case-insensitive way
    // Also support Conventional Commits: BREAKING CHANGE or "!" for major; feat for minor; fix/perf for patch
    // Fallback to PATCH when nothing else matches by making patchPattern match anything
    majorPattern = ~/(?i)(\[major\]|BREAKING CHANGE|!\:)/
    minorPattern = ~/(?im)(\[minor\]|^feat(\(|:))/
    patchPattern = ~/(?ism)(\[patch\]|^fix(\(|:)|^perf(\(|:)|^refactor(\(|:)|^chore(\(|:)|^docs(\(|:)|^style(\(|:)|^test(\(|:)|^build(\(|:)|^ci(\(|:)|^revert(\(|:)|^misc(\(|:)|.)/ 
}