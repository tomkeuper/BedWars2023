name: Deploy package to BedWars Repo + Create a release

on:
  push:
    branches: [production, workflow-test]

jobs:
  create-jar:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: 'production'
          fetch-depth: 0 # Fetch all history and tags
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: release-candidate
      - name: Ensure Gradle wrapper is executable
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi
      - name: Package with Gradle
        run: |
          ./gradlew clean tag shadowJar -Prelease
      - name: Set version
        id: set-version
        run: |
          VERSION=$(./gradlew printTag | awk '/Generated Tag:/ {print $3}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bedwars-plugin
          path: bedwars-plugin/build/libs/**.jar
          if-no-files-found: error
  release:
    runs-on: ubuntu-latest
    needs: [ create-jar ]
    permissions:
      contents: write
    steps:
      - name: Download the artifact
        uses: actions/download-artifact@v5
        with:
          name: bedwars-plugin
          path: target
      - name: Print generated tags
        run: |
          echo "Generated Tag: ${{ needs.create-jar.outputs.version }}"
      - name: Create release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: production
          tag_name: ${{ needs.create-jar.outputs.version }}
          generate_release_notes: true
          files: "target/BedWars-*"
  deploy-package:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [ release ]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: 'production'
          fetch-depth: 0 # Fetch all history and tags
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: release-candidate
      - name: Ensure Gradle wrapper is executable
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi
      - name: Deploy Package
        env:
          REPO_USER: ${{ secrets.REPO_USER }}
          REPO_PASS: ${{ secrets.REPO_PASS }}
        run: ./gradlew clean publish --stacktrace -PdeployUsername="${REPO_USER}" -PdeployPassword="${REPO_PASS}"
  javadoc:
    name: Publish JavaDoc
    runs-on: ubuntu-latest
    needs: deploy-package
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: 'production'
          fetch-depth: 0 # Fetch all history and tags
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: release-candidate
      - name: Ensure Gradle wrapper is executable
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi
      - name: Install Packages
        run: ./gradlew clean publishToMavenLocal --no-daemon --stacktrace
      - name: Build JavaDoc
        run: ./gradlew javadoc --no-daemon --stacktrace
      - name: Deploy JavaDoc 🚀
        uses: eiserv/easySFTP@v3
        with:
          host: ${{ secrets.JDC_IP_ADDRESS }}
          username: ${{ secrets.JDC_USER }}
          private-key: ${{ secrets.JDC_PRIVATE_KEY }}
          source: 'bedwars-api/build/docs/javadoc'
          target: '/var/www/tomkeuper.com/javadocs'
          # Replaces removeExtraFilesOnServer: uploads changed files and
          # deletes the ones a previous run put there and that are now gone.
          mode: sync
          # Same trust model as before. Once a JDC_KNOWN_HOSTS secret exists,
          # replace this with: known-hosts: ${{ secrets.JDC_KNOWN_HOSTS }}
          allow-any-host-key: true