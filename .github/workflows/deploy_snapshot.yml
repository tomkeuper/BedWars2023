name: Deploy snapshot package to BedWars Repo

on:
  push:
    branches: [development, workflow-test]
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  publish:
    name: Deploy package to repo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: 'development'
          fetch-depth: 0 # Fetch all history and tags
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: release-candidate
      - name: Ensure Gradle wrapper is executable
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi
      - name: Deploy Package
        env:
          REPO_USER: ${{ secrets.REPO_USER }}
          REPO_PASS: ${{ secrets.REPO_PASS }}
        run: ./gradlew publish --stacktrace -PdeployUsername="${REPO_USER}" -PdeployPassword="${REPO_PASS}"
  changed-files:
    runs-on: ubuntu-latest
    name: Check if api changed
    outputs:
      api-changed: ${{ steps.changed-files-specific.outputs.any_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Get changed files in the api folder
        id: changed-files-specific
        uses: tj-actions/changed-files@v46
        with:
          files: bedwars-api/**
      - name: List all changed files
        run: |
          for file in ${ALL_CHANGED_FILES}; do
            echo "$file was changed"
          done
  javadoc:
    name: Publish JavaDoc
    runs-on: ubuntu-latest
    needs: changed-files
    if: needs.changed-files.outputs.api-changed == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: 'development'
          fetch-depth: 0 # Fetch all history and tags
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: release-candidate
      - name: Ensure Gradle wrapper is executable
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi
      - name: Install Packages
        run: ./gradlew clean publishToMavenLocal --no-daemon --stacktrace
      - name: Build JavaDoc
        run: ./gradlew javadoc --no-daemon --stacktrace
      - name: Deploy JavaDoc 🚀
        uses: eiserv/easySFTP@v3
        with:
          host: ${{ secrets.JDC_IP_ADDRESS }}
          username: ${{ secrets.JDC_USER }}
          private-key: ${{ secrets.JDC_PRIVATE_KEY }}
          source: 'bedwars-api/build/docs/javadoc'
          target: '/var/www/tomkeuper.com/javadocs'
          # Replaces removeExtraFilesOnServer: uploads changed files and
          # deletes the ones a previous run put there and that are now gone.
          mode: sync
          # Same trust model as before. Once a JDC_KNOWN_HOSTS secret exists,
          # replace this with: known-hosts: ${{ secrets.JDC_KNOWN_HOSTS }}
          allow-any-host-key: true
