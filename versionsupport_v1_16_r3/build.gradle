dependencies {
    compileOnly project(':bedwars-api')
    implementation project(':versionsupport_common')
    compileOnly 'org.spigotmc:spigot:1.16.5-R0.1-SNAPSHOT'
    compileOnly 'org.apache.commons:commons-lang3:3.14.0'
    implementation "net.kyori:adventure-api:4.14.0"
    implementation "net.kyori:adventure-platform-bukkit:4.3.1"
    implementation "net.kyori:adventure-text-minimessage:4.14.0"
}

tasks.named('compileJava', JavaCompile) {
    options.release = 16
}

tasks.shadowJar {
    archiveClassifier.set("")
    relocate "net.kyori", "com.tomkeuper.bedwars.libs.kyori"
}

repositories {
    // Important Repos
    mavenCentral()
    mavenLocal()
    maven { url = uri('https://repo.codemc.io/repository/nms/') } // Spigot
}

description = 'versionsupport_v1_16_r3'
